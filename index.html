<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover plus the safe-area insets in style.css keep the HUD
      off the notch and off the home indicator. Nimiq Pay renders this in a
      WebView that goes edge to edge, so without this the timer sits under the
      status bar on most phones.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4ede0" />
    <meta name="color-scheme" content="light" />
    <title>sFace</title>
    <meta
      name="description"
      content="Every day the worst-performing coin becomes a level. Fly its real chart and pull the faces out."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph, so a shared challenge link is not a bare URL in a feed. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="sFace" />
    <meta
      property="og:description"
      content="Every day the worst-performing coin becomes a level. Fly its real chart and pull the faces out."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!--
      Preloaded, because the wordmark on the very first screen is set in it and
      a display face that arrives late makes the splash visibly reflow. Only the
      latin subset: the extended one is for the rare accented handle and can
      wait until something needs it.
    -->
    <link
      rel="preload"
      href="/fonts/luckiest-guy-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      Three layers. The canvas is the world and is always drawing. #ui is the
      screen on top of it. #chrome is the app bar, kept out of #ui because
      every screen mounts by replacing #ui wholesale, and a bar that is torn
      down and rebuilt on every repaint is a bar that flickers.
    -->
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <header id="chrome" hidden></header>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
